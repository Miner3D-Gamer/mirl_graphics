[package]
name = "mirl_graphics"
version = "0.0.0-alpha"
edition = "2024"
repository = "https://github.com/Miner3D-Gamer/mirl_graphics"
license.workspace = true
authors.workspace = true
rust-version.workspace = true
maintenance.workspace = true

[features]
default = ["std"]
all = [
    "image",
    "binary_data_plugin",
    "mirl_buffer/all",
    "mirl_collections?/all",
    "random",
]
_checking = ["all"]
std = [
    "bitcode?/std",
    "mirl_buffer/std",
    # "rand?/std",
    "serde?/std",
    "strum?/std",
    "wincode?/std",
    "zerocopy?/std",
]
# Compatibility with ffi
c_compatible = ["mirl_buffer/c_compatible", "mirl_collections?/c_compatible"]
# Enables all codecs
all_codecs = [
    "serde",
    "bitcode",
    "wincode",
    "compactly",
    "zerocopy",
    "mirl_buffer/all_codecs",
    "mirl_collections?/all_codecs",
]
# # All enum extensions# all_enum_extensions = ["strum", "enum_ext"]
# Codec stuff
serde = [
    "dep:serde",
    "bitcode?/serde",
    "mirl_buffer/serde",
    "mirl_collections?/serde",
    # "rand?/serde",
]
bitcode = ["dep:bitcode", "mirl_buffer/bitcode", "mirl_collections?/bitcode"]
wincode = ["dep:wincode", "mirl_buffer/wincode", "mirl_collections?/wincode"]
compactly = [
    "dep:compactly",
    "mirl_buffer/compactly",
    "mirl_collections?/compactly",
]
zerocopy = [
    "dep:zerocopy",
    "mirl_buffer/zerocopy",
    "mirl_collections?/zerocopy",
]
# Enum extensions
strum = ["dep:strum", "mirl_collections?/strum"]
enum_ext = ["dep:enum_ext", "mirl_collections?/enum_ext"]
binary_data_plugin = ["dep:inventory", "mirl_collections"]
# SVG?/resvg supports
svg = ["dep:resvg"]
# mirl_buffer = ["dep:mirl_buffer"]
image = ["dep:image"]
random = ["dep:getrandom", "std", "enum_ext?/random"]

[dependencies]
bitcode = { version = "0.6", optional = true, default-features = false, features = [
    "derive",
] }
# Codec
compactly = { version = "0.2", optional = true }
enum_ext = { version = "0.6", optional = true, default-features = false }
# graphics & render
image = { version = "0.25", optional = true, default-features = false }
# BinaryData
inventory = { version = "0.3.24", optional = true }
# mirl_extensions_conversion = { version = "0.0.0-alpha" }
# mirl_input = { version = "0.0.0-alpha", optional = true }
mirl_buffer = { version = "0.0.0-alpha" }
mirl_collections = { version = "0.0.0-alpha", optional = true }
mirl_macros = { version = "0.0.0-alpha" }

# Rasterize SVG
resvg = { version = "0.48", optional = true, default-features = false }
serde = { version = "1.0", optional = true, default-features = false, features = [
    "derive",
] }
# Enum functionality
strum = { version = "0.28", optional = true, default-features = false, features = [
    "derive",
] }
wincode = { version = "0.6", optional = true, features = ["derive"] }
zerocopy = { version = "0.8", optional = true, default-features = false, features = [
    "float-nightly",
    "derive",
] }
[target.'cfg(any(target_arch = "wasm32", target_arch = "wasm64"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
[target.'cfg(not(any(target_arch = "wasm32", target_arch = "wasm64")))'.dependencies]
getrandom = { version = "0.4", optional = true }
[build-dependencies]
mirl_build_tools = { version = "0.0.0-alpha" }

[lints]
workspace = true
